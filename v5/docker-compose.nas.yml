# v5 canary — SIDE-BY-SIDE with production (host port 8010; prod keeps 8000).
# Every value comes from an .env file next to this compose on the host
# (chmod 600, never committed). SAFE DEFAULTS: tier=read, sends disabled.
#
# Rollback at any point: docker compose down (prod is never touched), or
# repin EWS_V5_TAG to the previous known-good tag and up -d.

services:
  ews-mcp-v5:
    # Pin the EXACT immutable tag (e.g. v4.5.0a1). Never :latest, never a
    # floating pull policy — deploys must be deliberate.
    image: ${EWS_V5_IMAGE:?set EWS_V5_IMAGE to the exact pinned image ref}
    container_name: ews-mcp-v5
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      EWS_SERVER_URL: ${EWS_SERVER_URL:?}
      EWS_EMAIL: ${EWS_EMAIL:?}
      EWS_USERNAME: ${EWS_USERNAME:?}
      EWS_PASSWORD: ${EWS_PASSWORD:?}
      EWS_INSECURE_SKIP_VERIFY: ${EWS_INSECURE_SKIP_VERIFY:-false}
      EWS_TZ: ${EWS_TZ:-Asia/Riyadh}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_API_KEY: ${MCP_API_KEY:?fresh canary key — never reuse prod's}
      EWS_CAPABILITY_TIER: ${EWS_CAPABILITY_TIER:-read}
      SEND_ENABLED: ${SEND_ENABLED:-false}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ewsmcp_v5_data:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /livez only: a cold Exchange must not flap the container.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ewsmcp_v5_data:
